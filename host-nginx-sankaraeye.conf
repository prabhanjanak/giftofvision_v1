# ==============================================================================
# Sankara Eye Foundation - Gift of Vision Production Host Nginx Reverse Proxy
# Domain: giftofvision.sankaraeye.in (or gov.sankaraeye.in / 192.168.1.244)
# Target: Docker Container running on 127.0.0.1:3000 or 192.168.1.244:3000
# ==============================================================================

# HTTP -> Redirect all traffic to HTTPS or serve on Internal IP
server {
    listen 80;
    listen [::]:80;
    server_name giftofvision.sankaraeye.in gov.sankaraeye.in 192.168.1.244;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # For internal IP testing (HTTP) or production domain
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Upgrade headers for WebSockets / Fast Refresh
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Real Client IP and Host headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts and buffers
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        client_max_body_size 50M;
    }
}

