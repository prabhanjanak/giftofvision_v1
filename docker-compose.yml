# ==============================================================================
# Sankara Eye Foundation - Gift of Vision Docker Compose Configuration
# ==============================================================================

version: '3.8'

services:
  giftofvision:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sankara_giftofvision_app
    restart: always
    ports:
      - "${PORT:-3000}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - sankara_net

networks:
  sankara_net:
    driver: bridge
